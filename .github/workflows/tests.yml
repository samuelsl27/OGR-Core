# SPDX-License-Identifier: AGPL-3.0-or-later
name: tests

on:
  push:
    branches: [main, "dev/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor `pyproject.toml` declares, and the job that
        # matters most: OGR Slip2D's 3.11 job was the only one failing for
        # five releases (v0.1.70–v0.1.75) on a PEP 701 f-string.
        python: ["3.11", "3.12", "3.13"]

    steps:
      # v7: the first majors on `node24` were v5/v6, and v7 is what the
      # suite vetted so the jump is not due again within the year
      # (tests/test_ci_actions_v10.py holds the floor).
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the core
        # No system libraries: the core has no Qt and no plotting.
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run the test suite
        # The runner exits non-zero when anything fails. PYTHONFAULTHANDLER
        # prints the Python stack of every thread if the process dies on a
        # signal.
        env:
          PYTHONFAULTHANDLER: "1"
        run: python tests/_runner.py

  # v0.2.3 — the programs that use this core. Which they are, the tag each
  # one pins and the command of its whole suite are read from
  # docs/consumidores.md by .github/scripts/program_suite.py: none of it is
  # repeated here. tests/test_ci_programs_v023.py holds that every program
  # of the table has its job below, or a stated reason not to have it yet.
  pins:
    name: The programs pin what the table says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Only the pyproject.toml of each program, from its default branch:
      # that file is the truth, and the table repeats it.
      - name: pyproject.toml of OGR Slip2D
        uses: actions/checkout@v7
        with:
          repository: samuelsl27/OGR-Slip2D
          path: programs/slip2d
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
      - name: pyproject.toml of OGR FEM2D
        uses: actions/checkout@v7
        with:
          repository: samuelsl27/OGR-FEM2D
          path: programs/fem2d
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
      - name: Compare each pin with its row of docs/consumidores.md
        # Needs nothing installed: the script reads the core of this tree.
        run: >-
          python core/.github/scripts/program_suite.py pins
          "OGR Slip2D=programs/slip2d"
          "OGR FEM2D=programs/fem2d"

  fem2d:
    name: OGR FEM2D against this core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
      - uses: actions/checkout@v7
        with:
          repository: samuelsl27/OGR-FEM2D
          path: program
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build and install the program
        # As the program's own CI does, without its matrix: the wheel (its
        # Rust engine, built with the toolchain of the runner), installed
        # with its dependencies -- ogr-core from the tag it pins -- and the
        # compiled module put in the tree, where its suite runs.
        working-directory: program
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip install dist/*.whl
          python .github/scripts/wheel_check.py extract dist/*.whl
      - name: Its whole suite against the core of this commit
        # The core of this checkout goes ahead of the installed one, and
        # the program's runner is asked to accept it (--dev-core): its
        # header names the tree and the version it measured.
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: python core/.github/scripts/program_suite.py run "OGR FEM2D" program

  # v0.2.4 — since its suite is green on Linux (its v0.1.476: run
  # 44847262314 of its CI, on its main).
  slip2d:
    name: OGR Slip2D against this core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
      - uses: actions/checkout@v7
        with:
          repository: samuelsl27/OGR-Slip2D
          path: program
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install system libraries for Qt
        # The list of the program's own CI: PySide6 needs them even off
        # screen, because its tests build real widgets.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0
      - name: Install the program
        # As the program's own CI does, without its matrix: with the extra
        # its server tests need, and with its dependencies -- ogr-core from
        # the tag it pins.
        working-directory: program
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: Its whole suite against the core of this commit
        # The command is the one of the table, variables included: that it
        # runs off screen and in four processes is said there, not here.
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: python core/.github/scripts/program_suite.py run "OGR Slip2D" program

  licence:
    name: Licence consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check SPDX headers and packaging metadata
        # Runs standalone: it only reads files, so it needs no dependencies
        # and gives fast feedback on a licence slip. The block scalar (`|`)
        # is not cosmetic: with a plain scalar YAML folds every line into
        # one and the heredoc never meets its `PY` terminator.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          import test_license_v10 as t
          failed = 0
          for name in dir(t):
              if not name.startswith("Test"):
                  continue
              inst = getattr(t, name)()
              for m in dir(inst):
                  if m.startswith("test_"):
                      try:
                          getattr(inst, m)()
                      except Exception as exc:
                          failed += 1
                          print(f"FAIL {name}.{m}: {exc}")
          print("licence checks failed:", failed)
          sys.exit(1 if failed else 0)
          PY
